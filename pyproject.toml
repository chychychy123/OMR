[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outcome-matched-retrieval"
version = "0.1.0"
description = "Outcome-matched retrieval and trajectory reuse for frozen visual world models"
requires-python = ">=3.11,<3.12"
dependencies = ["torch>=2.8,<2.9", "numpy", "gymnasium", "scikit-learn", "stable-worldmodel==0.1.1"]

[tool.setuptools.packages.find]
where = ["src"]
